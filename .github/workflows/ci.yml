name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    env:
      # The runner's PHP also runs the PHP server's tests; never skip them.
      REQUIRE_PHP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  php:
    # The shared hosting (cPanel) version, on the oldest PHP it supports.
    runs-on: ubuntu-latest
    env:
      REQUIRE_PHP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, openssl, curl, mbstring, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: find php tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npx vitest run tests/
      - run: npm run build:cpanel
      - uses: actions/upload-artifact@v4
        with:
          name: sms-portal-cpanel
          path: dist/sms-portal-cpanel-*.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: voip-ms-sms-portal:ci
