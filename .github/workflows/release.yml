name: Release

# Publishes the version in package.json once it reaches main, if it has no tag
# yet: tag vX.Y.Z, a GitHub release with its changelog section, the cPanel zip
# and release.json (read by running servers to offer the update), and the
# Docker image on ghcr.io. Prepare one with "npm run release:prepare".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is this version released?
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released: nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.new == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, openssl, curl, mbstring, intl
          coverage: none
      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - if: steps.version.outputs.new == 'true'
        name: Test
        run: |
          npm ci
          npm run typecheck
          npm test

      - if: steps.version.outputs.new == 'true'
        name: Build the cPanel package
        run: |
          npm run build:cpanel
          node scripts/release-manifest.mjs

      - if: steps.version.outputs.new == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.version.outputs.new == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.version.outputs.new == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.version.outputs.new == 'true'
        name: Image names
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${{ steps.version.outputs.version }}"
          echo "tags=$image:$version,$image:${version%.*},$image:latest" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.new == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - if: steps.version.outputs.new == 'true'
        name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" \
            "dist/sms-portal-cpanel-$version.zip" dist/release.json \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --notes-file dist/release-notes.md
