services:
  sms-portal:
    # Published with each release; "docker compose pull && docker compose up -d" updates it.
    # Compose builds from this folder instead when the image cannot be pulled.
    image: ghcr.io/dansleboby/voip-ms-sms-portal:latest
    build: .
    container_name: sms-portal
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Required: password protecting the web interface.
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      # Optional: VoIP.ms API credentials. Leave empty to enter them in the setup wizard.
      VOIPMS_API_USERNAME: ${VOIPMS_API_USERNAME:-}
      VOIPMS_API_PASSWORD: ${VOIPMS_API_PASSWORD:-}
      # How often to check for new messages, in seconds.
      POLL_INTERVAL_ACTIVE: ${POLL_INTERVAL_ACTIVE:-10}
      POLL_INTERVAL_IDLE: ${POLL_INTERVAL_IDLE:-60}
      # Set to true when served over HTTPS behind a reverse proxy.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # "poll" if a proxy in front cannot pass Server-Sent Events through.
      LIVE_UPDATES: ${LIVE_UPDATES:-stream}
      # Address of the app (https://sms.example.com), for proxies that rewrite Host.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Optional: contact given to browser push services (mailto: or https: URL).
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Look for new releases on GitHub (Settings > Updates).
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
      # Optional: the only numbers to use, or numbers to leave alone (comma-separated).
      ALLOWED_DIDS: ${ALLOWED_DIDS:-}
      EXCLUDED_DIDS: ${EXCLUDED_DIDS:-}
      # Owner of ./data and user running the app (default 1000:1000).
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./data:/data
