; On top of Debian's php.ini for Apache.
expose_php = Off
display_errors = Off
; Errors go to the container's logs, through Apache (or stderr, for the checks).
log_errors = On
; Contacts exported with their photos (iCloud, Google) can be large: vCard files up to 12 MB.
post_max_size = 16M
upload_max_filesize = 12M
memory_limit = 256M
