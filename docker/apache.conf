# The portal's site: the web client, api.php and their .htaccess, as on shared hosting.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:${PORT}>
    DocumentRoot /app/site

    <Directory /app/site>
        Options -Indexes +FollowSymLinks
        # The site's own .htaccess routes the API and the app's pages, as on a cPanel host.
        AllowOverride All
        Require all granted
    </Directory>

    # Errors only: open tabs ask for news every few seconds, which would fill the logs.
    ErrorLog /proc/self/fd/2
    LogLevel warn
</VirtualHost>

# TRUST_PROXY: the client's address comes from X-Forwarded-For, when a trusted proxy sends it.
<IfDefine TRUST_PROXY>
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy ${SMS_PORTAL_PROXIES}
</IfDefine>
